<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Enigma. Reseñas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2de;--bg2:#ebe5c6;--b:#0b3fc4;--b2:#1a52d9;--ind:#2a1fb8;--ink:#10153a;--m:#5d6285}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Poppins,system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:26px 18px 70px}
.logo{display:block;margin:14px auto 4px;height:84px;width:auto}
.wm{font:700 2.8rem Poppins,sans-serif;color:var(--ind);text-align:center;line-height:1.3}
.sub{text-align:center;font:italic 400 1.1rem Poppins,sans-serif;color:var(--b);margin-bottom:26px}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:2px solid var(--b);border-radius:40px;color:var(--b);font:600 .95rem Poppins;letter-spacing:.06em;padding:11px;cursor:pointer}
.tabs button.on{background:var(--b);color:var(--bg)}
input{width:100%;background:#fffdf3;border:2px solid var(--bg2);border-radius:40px;padding:14px 22px;color:var(--ink);font:1rem Poppins;margin-bottom:22px}
input:focus,button:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--ind)}
.card{display:flex;gap:18px;background:#fffdf3;border:2px solid var(--bg2);border-radius:24px;padding:16px;margin-bottom:16px;cursor:pointer}
.card:hover{border-color:var(--b)}
.cvw{background:var(--b);border-radius:16px;padding:12px 10px;flex:none}
.cv,.ph{width:84px;height:124px;border-radius:4px;object-fit:cover;display:block;box-shadow:0 8px 14px #0006;background:var(--ind);color:var(--bg);font:700 2.4rem Poppins;display:grid;place-items:center}
.card h3{margin:0;font:700 1.2rem/1.3 Poppins,sans-serif;color:var(--b)}.card p{margin:4px 0;color:var(--m);font-size:.9rem}
.st{background:linear-gradient(90deg,var(--b) var(--p),#c9c3a4 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;font-size:1.2rem}
.r{color:var(--b);font-weight:600;margin-left:10px}
.tag{display:inline-block;background:var(--b);color:var(--bg);font-weight:500;font-size:.85rem;padding:2px 14px;border-radius:30px}
.back{background:none;border:0;color:var(--b);font:600 1rem Poppins;cursor:pointer;padding:8px 0}
.hero{position:relative;overflow:hidden;background:var(--b);border-radius:28px 28px 0 0;padding:34px 20px 0;text-align:center;isolation:isolate}
.hero::before{content:"RESEÑA";position:absolute;left:0;right:0;top:-2px;z-index:-1;font:700 4rem/1 Poppins;letter-spacing:.14em;color:var(--b2);white-space:nowrap}
.hero .cv{width:150px;height:222px;margin:0 auto;font-size:4rem}
.hero .wave{height:46px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;margin:-6px -20px 0}
.det{background:#fffdf3;border:2px solid var(--bg2);border-top:0;border-radius:0 0 28px 28px;padding:6px 24px 28px}
.det h1{font:700 1.7rem/1.2 Poppins;letter-spacing:.03em;color:var(--b);text-align:center;margin:0 0 18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--bg2)}.row span:last-child{font-weight:600;text-align:right}
.buy{display:block;text-align:center;background:var(--ind);border-radius:40px;padding:12px;color:var(--bg);text-decoration:none;font-weight:600;letter-spacing:.1em;margin-top:16px}
.det h2{background:var(--b);color:var(--bg);border-radius:14px;padding:8px 18px;font:600 1.05rem Poppins;letter-spacing:.06em;margin:30px 0 8px}
.det h3{margin:18px 0 0;font:600 1rem Poppins,sans-serif;color:var(--ind)}.det p{margin:4px 0}
blockquote{margin:8px 0;padding:8px 16px;border-left:4px solid var(--b);font:italic 400 1rem Poppins,sans-serif;background:var(--bg);border-radius:0 12px 12px 0}
.sent{display:flex;justify-content:space-around;text-align:center;margin:10px 0;color:var(--m)}.sent div{font-size:1.7rem}.sent small{display:block;font-size:.8rem}
.punt{background:var(--bg);border-radius:14px;padding:10px 18px}
details{background:var(--bg);border:2px dashed var(--b);border-radius:16px;padding:4px 16px 12px;margin-top:26px}
summary{cursor:pointer;font-weight:600;color:var(--b);padding:8px 0}details h2{margin-top:14px}
.pie{text-align:center;margin-top:30px;font:700 1.6rem Poppins;color:var(--ind)}
.vacio{text-align:center;color:var(--m)}
.tabs button{font-size:.76rem;padding:11px 2px;letter-spacing:.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips button{background:none;border:2px solid var(--b);border-radius:30px;color:var(--b);font:600 .85rem Poppins;padding:4px 16px;cursor:pointer}.chips .on{background:var(--b);color:var(--bg)}
.cnt{color:var(--m);font-size:.85rem;margin:0 0 12px}.lec{cursor:default;padding:12px;gap:14px}.lec:hover{border-color:var(--bg2)}.lec .cv{width:58px;height:86px;font-size:1.6rem}.lec .cvw{padding:8px 7px;align-self:flex-start}.lec h3{font-size:1.02rem}.nota{font-style:italic;font-size:.85rem!important}
.prog{position:relative;height:96px;margin:22px 22px 4px}.bar{position:absolute;left:0;right:0;top:34px;height:12px;border-radius:12px;background:linear-gradient(90deg,#fff 0,var(--b) 100%);border:1px solid var(--b)}.pt{position:absolute;top:18px;transform:translateX(-50%);text-align:center}.pt .em{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fffdf3;border:2px solid var(--b);font-size:1.4rem;line-height:1}.pt small{display:block;margin-top:4px;font-size:.78rem;font-weight:600;color:var(--b)}
</style></head><body><main id="app"></main>
<script>
const D=[{"titulo": "Noches Blancas", "autor": "Fiodor Dostoievski", "anio": "1848", "reseñado": "2026-10-11", "calificacion": 4.7, "genero": "Clásico romance", "portada": "noches_blancas.jpg", "comprar": "", "sentimientos": "25=😔, 50=☺️, 75=😬, 100=🥺", "html": "<p>Hay personajes con los que conectas desde la primera página y que no sueltas ni cuando cierras el libro. El soñador de Dostoievski es uno de ellos: un hombre que vive solo en San Petersburgo, que habla con las paredes, que conoce las casas de su barrio como si fueran viejos amigos porque son todo lo que tiene. Suena triste, y lo es. 😔 Hasta que una noche, en el canal, aparece Nastenka y todo cambia.</p><p>La prosa de Dostoievski en esta novela es sorprendentemente accesible. Poética, cargada de sentimiento pero sin enredarse, fluye rápido y te arrastra con ella. 💫 Mucha gente ve el nombre del autor y asume complicación, pero <em>Noches Blancas</em> desmiente eso de entrada: es corta, ágil y entretenida de inicio a fin. El ritmo no decae en ningún momento, y los diálogos entre los protagonistas son tan profundos y cargados de emoción que duelen. Bien escritos, bien construidos, cada uno en su sitio exacto.</p><p>Conectar con el protagonista fue inevitable. Su soledad, su rutina, la monotonía de días que se repiten sin que nada cambie, y luego esa ilusión que llega de golpe: la esperanza de que quizás, esta vez, algo sea diferente. 😬 Nastenka es el centro gravitacional de toda la obra; sin ella no hay historia, no hay tensión, no hay nada. Y aunque no hay giros argumentales al estilo thriller, el verdadero giro es emocional: sabes casi desde el principio cómo va a terminar, y aun así te niegas a aceptarlo.</p><p>Y luego está esto:</p><blockquote>Ayer en sus palabras había tanta ternura, tanta bondad de corazón… ¡Cómo me cuidó, cuántas carantoñas me hizo! ¡Cómo animó y aduló a mi corazón! ¡Cuánta coquetería de felicidad! Y yo…, yo me lo tomé en serio, creí que ella… 🥺</blockquote><p>Eso es lo que rompe. No la pérdida en sí, sino el haber creído. El desenlace llega exactamente como lo temías, y aun así golpea como si no lo hubieras visto venir.</p><p>Una lectura perfecta para quien quiere iniciarse en Dostoievski sin caer de cabeza al océano de sus grandes obras. Y para quien, como el protagonista, conoce bien lo que es la soledad. 📖</p><p>ENIGMA que deja: ¿Alguien me sacará de mi soledad algún día?</p><details><summary>⚠️ Con spoilers · toca para abrir</summary><p>Lo que más golpea al cerrar el libro es darse cuenta de que en ningún momento de la obra sabemos el nombre del protagonista. Solo escuchamos a Nastenka. Todo su mundo era ella. Y por unas cuantas noches blancas, él fue feliz. Eso basta. Y eso duele.</p></details>", "id": "noches-blancas", "sent": [["25", "😔"], ["50", "☺️"], ["75", "😬"], ["100", "🥺"]]}, {"titulo": "La perla", "autor": "John Steinbeck", "anio": "1947", "reseñado": "2026-10-10", "calificacion": 3.5, "genero": "Clásico", "portada": "la_perla.jpg", "comprar": "", "sentimientos": "25=🙂, 50=😐, 75=😴, 100=🤯", "html": "<p>Kino, un pescador indígena, encuentra en el fondo del mar la perla más grande del mundo. La fortuna de su vida. El boleto de salida a una existencia mejor para su familia. Suena a cuento de hadas, ¿no? Pues Steinbeck se encargó de recordarnos que los cuentos de hadas no fueron escritos para los pobres. 🎭💔 Es una novela corta, publicada en 1947 e inspirada en un cuento popular mexicano, que se lee en una tarde pero te deja pensando mucho más tiempo.</p><p>La prosa del autor es lo primero que te atrapa. Rápida, poética, con ese toque de realismo mágico que hace que el mar se sienta vivo y la perla casi... respire. 🌊✨ Los diálogos son pocos pero quirúrgicos: cada uno aparece justo cuando la trama lo necesita y se equilibra perfectamente con las descripciones que Steinbeck teje como si escribiera con pincel y no con pluma. En ese sentido, el hombre sabe lo que hace.</p><p>Ahora bien, conectar con Kino es otro tema. 😕 Los personajes son sombríos, distantes, y aunque el autor claramente quiere que sufras con su protagonista, mantenerlo tan hermético hace difícil entrar a su mundo interior. Yo no conecté con ninguno. La primera mitad engancha, pero desde la mitad hasta el penúltimo cuarto la historia pierde el hilo y la lectura se vuelve un ejercicio de paciencia. 📉 Lo bueno es que el final lo rescata todo: el único twist del libro llega sin avisar y golpea fuerte, de esos que te hacen cerrar el libro un momento y quedarte mirando el techo. 👁️ Ese final le devolvió los puntos que había perdido en el tramo lento.</p><p>Y luego está esa frase que lo resume todo:</p><blockquote>No hay espíritu más desprendido en el mundo que el de un pobre a quien de pronto favorece la fortuna. 🥺</blockquote><p>Eso es lo que más duele de La Perla. No el crimen, no la pérdida. Sino la impotencia de ver cómo, justo cuando a un pobre le llega la fortuna, es cuando más piedras encuentra en el camino, cuando lo único que quiere es que las cosas cambien para toda su familia, que es lo más importante. Y terminar de esa manera es simplemente triste.</p><p>Se lo recomiendo a quien quiera un clásico corto para pasar el rato y disfrutar de una lectura entretenida. Imperfecto en el medio, pero con un final y un mensaje que se quedan. 📖</p><p>ENIGMA que deja: ¿Es un pecado que una persona pobre tenga un poco de suerte?</p><details><summary>⚠️ Con spoilers · toca para abrir</summary><p>La perla promete salir de la pobreza, pero lo que hace es atraer problemas: de repente todos quieren algo de Kino. Y lo que lo hace tan fuerte es que al final no hay premio. Kino lo pierde casi todo por querer algo mejor para los suyos, y esa idea de que la suerte, cuando le llega a un pobre, cuesta más de lo que da, es lo que te deja mirando el techo.</p></details>", "id": "la-perla", "sent": [["25", "🙂"], ["50", "😐"], ["75", "😴"], ["100", "🤯"]]}],LEC=[{"titulo": "Los espantapájaros andan a medianoche", "autor": "R. L. Stine", "estrellas": 4.5, "genero": "Terror", "anio": 2024, "nota": "", "imagen": "Losesp.jpg"}, {"titulo": "El ladrón del rayo", "autor": "Rick Riordan", "estrellas": 4.0, "genero": "Fantasía", "anio": 2024, "nota": "", "imagen": "Ladron.jpg"}, {"titulo": "La maldición del titán", "autor": "Rick Riordan", "estrellas": 4.0, "genero": "Fantasía", "anio": 2024, "nota": "", "imagen": "Malti.jpg"}, {"titulo": "El mar de los monstruos", "autor": "Rick Riordan", "estrellas": 3.5, "genero": "Fantasía", "anio": 2024, "nota": "", "imagen": "Mar.jpg"}, {"titulo": "Hooked", "autor": "Emily Mcintire", "estrellas": 3.0, "genero": "Romance", "anio": 2024, "nota": "", "imagen": "Hooked.jpg"}, {"titulo": "El hombre del laberinto", "autor": "Donato Carrisi", "estrellas": 5.0, "genero": "Thriller", "anio": 2024, "nota": "El mejor libro de mi vida, escrito por mi autor favorito... ¿y ese final? ¡Uff!", "imagen": "Labe.jpg"}, {"titulo": "El misterio de Sittaford", "autor": "Agatha Christie", "estrellas": 3.5, "genero": "Misterio", "anio": 2024, "nota": "", "imagen": "Sittaford.jpg"}, {"titulo": "Asesinato para principiantes", "autor": "Holly Jackson", "estrellas": 4.5, "genero": "Misterio", "anio": 2024, "nota": "", "imagen": "Aseprin.jpg"}, {"titulo": "Dentro de casa", "autor": "Lisa Jewell", "estrellas": 4.5, "genero": "Thriller", "anio": 2024, "nota": "", "imagen": "Dentcasa.jpg"}, {"titulo": "El imperio final", "autor": "Brandon Sanderson", "estrellas": 4.6, "genero": "Fantasía", "anio": 2024, "nota": "Si ya entraste en esta saga no vas a poder salir", "imagen": "Imperio.jpg"}, {"titulo": "Invisible", "autor": "Eloy moreno", "estrellas": 5.0, "genero": "Novela", "anio": 2024, "nota": "Super triste, debería ser lectura obligatoria en todas las instituciones", "imagen": "Invisible.jpg"}, {"titulo": "El susurrador", "autor": "Donato Carrisi", "estrellas": 5.0, "genero": "Thriller", "anio": 2024, "nota": "", "imagen": "Susurra.jpg"}, {"titulo": "El último regalo", "autor": "Sebastian Fitzek", "estrellas": 4.2, "genero": "Thriller", "anio": 2024, "nota": "", "imagen": "Regalo.jpg"}, {"titulo": "Figuras ocultas", "autor": "Jason Rekulak", "estrellas": 4.0, "genero": "Terror", "anio": 2024, "nota": "", "imagen": "Figocul.jpg"}, {"titulo": "Alguien a quien conoces", "autor": "Shari Lapena", "estrellas": 3.0, "genero": "Crimen", "anio": 2024, "nota": "", "imagen": "Algcon.jpg"}, {"titulo": "Apartamento en París", "autor": "Lucy Foley", "estrellas": 4.0, "genero": "Suspenso", "anio": 2024, "nota": "No es tan espectacular como el hyoe q tiene", "imagen": "Apto.jpg"}, {"titulo": "La asistenta", "autor": "Freida McFadden", "estrellas": 4.0, "genero": "Thriller", "anio": 2024, "nota": "", "imagen": "Asistenta.jpg"}, {"titulo": "El pozo de la ascensión", "autor": "Brandon Sanderson", "estrellas": 4.5, "genero": "Fantasía", "anio": 2025, "nota": "", "imagen": "Ascensión.jpg"}, {"titulo": "Aún sigue aquí", "autor": "Lisa Jewell", "estrellas": 2.5, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Aunaqui.jpg"}, {"titulo": "Las doncellas", "autor": "Alex Michaelides", "estrellas": 4.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Doncella.jpg"}, {"titulo": "Terapia", "autor": "Sebastian Fitzek", "estrellas": 5.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Terapia.jpg"}, {"titulo": "El cuarto mono", "autor": "J. D. Barker", "estrellas": 3.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "4Mono.jpg"}, {"titulo": "El tiempo que tuvimos", "autor": "", "estrellas": 4.0, "genero": "", "anio": 2025, "nota": "", "imagen": "Tiempoten.jpg"}, {"titulo": "Los siete maridos de Evelyn Hugo", "autor": "Taylor Jenkins Reid", "estrellas": 3.5, "genero": "Novela", "anio": 2025, "nota": "", "imagen": "Sietemar.jpg"}, {"titulo": "El mentiroso", "autor": "Mikel Santiago", "estrellas": 4.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Mentiroso.jpg"}, {"titulo": "La paciente silenciosa", "autor": "Alex Michaelides", "estrellas": 4.5, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Pacientesil.jpg"}, {"titulo": "La hipótesis del mal", "autor": "Donato Carrisi", "estrellas": 5.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Hipmal.jpg"}, {"titulo": "El hombre de tiza", "autor": "C. J. Tudor", "estrellas": 3.5, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Tiza.jpg"}, {"titulo": "Verity", "autor": "Colleen Hoover", "estrellas": 4.5, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Verity.jpg"}, {"titulo": "Los niños de la casa del lago", "autor": "Gregg Dunnett", "estrellas": 2.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Ninolag.jpg"}, {"titulo": "La verdad sobre el caso Harry Quebert", "autor": "Joël Dicker", "estrellas": 5.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Quebert.jpg"}, {"titulo": "El caso Hartung", "autor": "Søren Sveistrup", "estrellas": 4.5, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Hartung.jpg"}, {"titulo": "Tras la puerta", "autor": "Freida McFadden", "estrellas": 3.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Traspuer.jpg"}, {"titulo": "No la dejes entrar", "autor": "", "estrellas": 5.0, "genero": "", "anio": 2025, "nota": "", "imagen": "Noent.jpg"}, {"titulo": "Sé lo que estás pensando", "autor": "John Verdon", "estrellas": 4.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Pensando.jpg"}, {"titulo": "Gestos letales", "autor": "Sebastian Fitzek", "estrellas": 5.0, "genero": "Thriller", "anio": 2025, "nota": "", "imagen": "Letales.jpg"}, {"titulo": "El héroe de las eras", "autor": "Brandon Sanderson", "estrellas": 5.0, "genero": "Fantasía", "anio": 2025, "nota": "", "imagen": "Eras.jpg"}, {"titulo": "Cómo vender una casa embrujada", "autor": "Grady Hendrix", "estrellas": 2.5, "genero": "Terror", "anio": 2025, "nota": "", "imagen": "Embrujada.jpg"}];let tab='rec',q='',yr=Math.max(0,...LEC.map(x=>x.anio));const app=document.getElementById('app');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=n=>`<span class=st style="--p:${n/5*100}%">★★★★★</span><span class=r>${n}</span>`;
const cv=b=>b.portada?`<img class=cv src="${e(b.portada)}" alt="Portada de ${e(b.titulo)}" onerror="this.outerHTML='<div class=\\'cv ph\\'>${e(b.titulo[0])}</div>'">`:`<div class="cv ph">${e(b.titulo[0])}</div>`;
const logo=`<img class=logo src="logo.png" alt="Enigma." onerror="this.outerHTML='<div class=wm>Enigma.</div>'">`;
function home(){
  const k=q.toLowerCase(),has=b=>(b.titulo+b.autor+b.genero).toLowerCase().includes(k);let body;
  if(tab=='lec'){
    const ys=[...new Set(LEC.map(x=>x.anio))].sort(),L=LEC.filter(b=>(!yr||b.anio==yr)&&has(b));
    body=`<div class=chips>${ys.map(y=>`<button class="${yr==y?'on':''}" data-y=${y}>${y}</button>`).join('')}<button class="${yr==0?'on':''}" data-y=0>Todos</button></div><p class=cnt>${L.length} libro${L.length==1?'':'s'}</p>`+(L.map(b=>`<div class="card lec"><div class=cvw>${cv({portada:b.imagen,titulo:b.titulo})}</div><div><h3>${e(b.titulo)}</h3><p>${e(b.autor)||'&nbsp;'}</p>${st(b.estrellas)}${b.genero?`<br><span class=tag>${e(b.genero)}</span>`:''}${b.nota?`<p class=nota>${e(b.nota)}</p>`:''}</div></div>`).join('')||'<p class=vacio>No hay lecturas con ese filtro.</p>');
  }else{
    const L=D.filter(b=>(tab=='all'||b.calificacion>=4)&&has(b));
    body=L.map(b=>`<div class=card tabindex=0 data-id="${e(b.id)}"><div class=cvw>${cv(b)}</div><div><h3>${e(b.titulo)}</h3><p>${e(b.autor)} • ${e(b.anio)}</p>${st(b.calificacion)}<br><span class=tag>${e(b.genero)}</span></div></div>`).join('')||'<p class=vacio>No hay reseñas con ese filtro.</p>';
  }
  const tb=(t,n)=>`<button class="${tab==t?'on':''}" data-t=${t}>${n}</button>`;
  app.innerHTML=`${logo}<div class=sub>Thrillers, suspenso y novelas</div>
  <div class=tabs>${tb('rec','RECOMENDADOS')}${tb('all','RESEÑAS')}${LEC.length?tb('lec','LECTURAS'):''}</div>
  <input id=q placeholder="Buscar libro, autor o género" value="${e(q)}" aria-label="Buscar"><div>${body}</div>`;
  app.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{tab=x.dataset.t;home()});
  app.querySelectorAll('[data-y]').forEach(x=>x.onclick=()=>{yr=+x.dataset.y;home()});
  const i=document.getElementById('q');i.oninput=()=>{q=i.value;const p=i.selectionStart;home();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll('.card:not(.lec)').forEach(x=>{x.onclick=()=>location.hash=x.dataset.id;x.onkeydown=ev=>ev.key=='Enter'&&x.click()});
}
function det(b){
  const f=new Date(b['reseñado']+'T00:00').toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`<button class=back onclick="location.hash=''">← Volver</button><div class=hero>${cv(b)}<div class=wave></div></div><div class=det><h1>${e(b.titulo).toUpperCase()}</h1>
  <div class=row><span>Autor</span><span>${e(b.autor)}</span></div><div class=row><span>Año</span><span>${e(b.anio)}</span></div>
  <div class=row><span>Reseñado</span><span>${e(f)}</span></div><div class=row><span>Calificación</span><span>${st(b.calificacion)}</span></div>
  <div class=row><span>Género</span><span class=tag>${e(b.genero)}</span></div>
  ${b.comprar?`<a class=buy href="${e(b.comprar)}" target=_blank rel=noopener>COMPRAR</a>`:''}
  ${b.html}
  ${b.sent.length?`<h2>SENTIMIENTOS EN LA LECTURA</h2><div class=prog><div class=bar></div>${b.sent.map(s=>`<div class=pt style="left:${+s[0]||0}%"><span class=em>${e(s[1])}</span><small>${e(s[0])}%</small></div>`).join('')}</div>`:''}
  <h2>PUNTUACIÓN</h2><div class=punt>${st(b.calificacion)}</div></div><div class=pie>Enigma.</div>`;
  scrollTo(0,0);
}
function go(){const b=D.find(x=>x.id==location.hash.slice(1));b?det(b):home()}
addEventListener('hashchange',go);go();
</script></body></html>
